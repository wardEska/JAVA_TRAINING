spring.application.name=mycoolapp

# server port
server.port=8585

#context path is empty to change it
#server.servlet.context-path=/mycoolapp

#default HTTP session timeout is 30 minutes, to change it
server.servlet.session.timeout=15m

# my props
coach.name=Micky Mouse
team.name=The Mouse Crew

# actuator endpoints
management.endpoints.web.exposure.include=health,info,mappings,beans
# to exspose all use *
#management.endpoints.web.exposure.include=*

#to execlude env endpoint
#management.endpoints.web.exposure.exclude=env

#base path for actuator endpoints
#management.endpoints.web.base-path=/mycoolapp/actuator

management.info.env.enabled=true

# configure info endpoint
info.app.name=My Super Cool App
info.app.description=A crazy and fun app, yahoo!
info.app.version=1.0.0

# security username and password for actuator endpoints
#spring.security.user.name=admin
#spring.security.user.password=admin123




#Log file name
#logging.file.name=mycoolapp.log
#logging.file.path=D:/Java projects/01-spring-boot-overview/01-dev-tools-demo/mycoolapp/logs

# log only errors and warns
#logging.level.root=warn

#JDBC Url for database connection
spring.datasource.url=jdbc:mysql://localhost:3306/springstudent

#login credentials for database connection
spring.datasource.username=root
spring.datasource.password=Eska12345


# turn of the spring boot banner
spring.main.banner-mode=off


#swagger
